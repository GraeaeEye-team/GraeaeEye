services:
  postgres:
    image: postgres:16-alpine
    container_name: graeae_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-graeae_eye_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/fintech_app/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-graeae_eye_db}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
    networks:
      internal_net:
        aliases:
          - db
          - postgres

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graeae_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-graeae_eye_db}
      - PYTHONPATH=/app/src
    volumes:
      - .:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_net
    develop:
      watch:
        - action: sync
          path: src/fintech_app
          target: /app

  db-backup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graeae_backup_daemon
    restart: unless-stopped
    command: ["python", "-m", "fintech_app.db.backup_daemon"]
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-graeae_eye_db}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-300}
      BACKUP_DIR: /app/src/fintech_app/db/backups
      PYTHONPATH: /app/src
    volumes:
      - ./src/fintech_app/db/backups:/app/src/fintech_app/db/backups
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    networks:
      - internal_net

volumes:
  postgres_data:

networks:
  internal_net:
    driver: bridge
