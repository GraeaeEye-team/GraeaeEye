services:
  db:
    image: postgres:16-alpine
    container_name: graeae_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-graeae_eye_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-graeae_eye_db}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
    networks:
      - internal_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graeae_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-graeae_eye_db}
    volumes:
      - .:/app
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_net

volumes:
  postgres_data:

networks:
  internal_net:
    driver: bridge