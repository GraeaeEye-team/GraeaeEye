[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart_credit_parser"
version = "0.1.0"
description = "Universal AI-driven ingestion and parser module anchored to PostgreSQL schema.sql"
authors = [{ name = "Smart Credit Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.9"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
