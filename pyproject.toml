[build-system]
requires = ["setuptools", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "GraeaeEye/__version__.py"
version_scheme = "release-branch-semver"

[project]
name = "GraeaeEye"
description = "the Most Unwanted Gizmo"
readme = "README.md"
version = "0.0.1"

[project.urls]
Repository = "https://github.com/AntyElo/GraeaeEye"
Changelog = "https://github.com/AntyElo/GraeaeEye/releases"
