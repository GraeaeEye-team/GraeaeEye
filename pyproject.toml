[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graeae-eye"
version = "0.1.4"
description = "Smart Credit & Cash Flow Risk Engine for SMEs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "psycopg[binary,pool]>=3.1.18",
    "pandas>=2.2.0",
    "pydantic>=2.6.0",
    "aiofiles~=23.2.0"
]

[tool.setuptools.packages.find]
where = ["src"]

