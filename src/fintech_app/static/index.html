<!DOCTYPE html>
<html lang="ru_RU">
<head>
	<title>GraeaeEye</title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/static/styles.css">
	<script src="/static/scripts.js"></script>
	<script>
		function upd_status() {
			var x = document.getElementById("status");
			fetch("/health")
				.then((response) => response.json())
				.then((json) => x.innerHTML = json.status == "ok" ? json.service + " is ok" : "Internal error!" );
		}
		/* document.addEventListener('DOMContentLoaded', function() { upd_status(); }, false); */
	</script>
</head>
<body>
	<center class="splash"><h1>GraeaeEye SPA</h1></center>
	<div id="main">
		<button onclick="upd_status()">health:</button><span id="status"></span>
	</div>
</body>
</html>
